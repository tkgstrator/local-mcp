[package]
name = "local-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Sandboxed filesystem MCP server speaking Streamable HTTP, for ChatGPT connectors"
repository = "https://github.com/tkgstrator/local-mcp"

[dependencies]
rmcp = { version = "3.1.4", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
axum = "0.8"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ignore = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
